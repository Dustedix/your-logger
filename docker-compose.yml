services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: workout_app_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - FLUTTER_WEB_PORT=8080

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workout_app_prod
    ports:
      - "0.0.0.0:8085:80"
    profiles:
      - prod

